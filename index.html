  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #1a1a2e;
      color: #e0e0e0;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 11px;
      opacity: 0.5;

    .toolbar {
      display: flex;
      gap: 8px;

    .toolbar button {

    }

    .toolbar button:hover { background: #e8e8e8; }
    .toolbar button.primary {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
    }
    .toolbar button.primary:hover { background: #2a2a4e; }

    .toolbar .spacer { flex: 1; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 13px;
      transition: transform 0.25s ease;
      z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.85);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .drop-overlay.visible { display: flex; }
    .drop-overlay-inner {
      border: 3px dashed rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 60px 80px;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      pointer-events: none;
    }

    .panes {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .pane {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      min-width: 100px;
      overflow: hidden;
    }

    body.resizing { cursor: col-resize; user-select: none; }

    .pane-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      padding: 6px 16px;
      background: #fafafa;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 14px;
      line-height: 1.6;
      background: #fff;
      tab-size: 2;
    }

    .divider {
      width: 5px;
      background: #ddd;
      flex-shrink: 0;
      cursor: col-resize;
      transition: background 0.15s;
    }
    .divider:hover, .divider.dragging {
      background: #aaa;
    }

    #preview {
      flex: 1;
      padding: 16px 24px;
      overflow-y: auto;
      background: #fff;
    }

    /* Markdown rendered content styles */
    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      margin-top: 1.2em;
      margin-bottom: 0.4em;

    }
    #preview h1 { font-size: 1.8em; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }

    #preview h3 { font-size: 1.15em; }
    #preview p { margin: 0.6em 0; line-height: 1.7; }
    #preview ul, #preview ol { margin: 0.6em 0; padding-left: 2em; }

      border-left: 3px solid #ccc;

    #preview pre code {

    #preview table {
      border-collapse: collapse;
      margin: 0.8em 0;

    }
    #preview th, #preview td {

      padding: 8px 12px;

    }
    #preview th { background: #f6f8fa; font-weight: 600; }
    #preview img { max-width: 100%; }
    #preview hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
    #preview a { color: #0366d6; }

    /* Print styles — only the preview pane prints */
    @media print {
      body { display: block; background: #fff; }
      header, .toolbar, .pane:first-child, .divider, .toast { display: none !important; }
      .panes { display: block; }
      .pane-label { display: none; }
      #preview {
        padding: 0;
        overflow: visible;

<body>

<header>
  <h1>Markdown to PDF — Simple, Free Converter</h1>
</header>

<div class="toolbar">
  <button onclick="clearEditor()">Clear</button>
  <div class="spacer"></div>
  <button onclick="copyHTML()">Copy HTML</button>
  <button class="primary" onclick="exportPDF()">Export PDF</button>
</div>

<div class="panes">
  <div class="pane">
    <div class="pane-label">Markdown</div>
    <textarea id="editor" spellcheck="false" placeholder="Type or paste markdown here — or drag and drop a .md file anywhere on the page"></textarea>
  </div>
  <div class="divider"></div>
  <div class="pane">
    <div class="pane-label">Preview</div>
    <div id="preview"></div>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-overlay-inner">Drop .md file to load</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const toast = document.getElementById('toast');

  marked.setOptions({
    highlight(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: true,
    gfm: true
  });

  function render() {
    preview.innerHTML = marked.parse(editor.value);
  }

  editor.addEventListener('input', render);

  // Tab key inserts spaces instead of changing focus
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      render();
    }
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function copyHTML() {
    const html = marked.parse(editor.value);
    navigator.clipboard.writeText(html).then(() => showToast('HTML copied to clipboard'));
  }

  function exportPDF() {
    window.print();
  }

  function clearEditor() {
    editor.value = '';
    render();
  }

  // Drag and drop .md files
  const dropOverlay = document.getElementById('dropOverlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('visible');
  });

  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter === 0) dropOverlay.classList.remove('visible');
  });

  document.addEventListener('dragover', (e) => e.preventDefault());

  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('visible');

    const file = e.dataTransfer.files[0];
    if (!file) return;

    if (!file.name.endsWith('.md') && !file.name.endsWith('.markdown') && file.type !== 'text/markdown') {
      showToast('Only .md files are supported');
      return;
    }

    file.text().then((text) => {
      editor.value = text;
      render();
      showToast(`Loaded ${file.name}`);
    });
  });

  // Resizable divider
  const divider = document.querySelector('.divider');
  const panes = document.querySelector('.panes');
  const leftPane = panes.children[0];
  const rightPane = panes.children[2];

  divider.addEventListener('mousedown', (e) => {
    e.preventDefault();
    document.body.classList.add('resizing');
    divider.classList.add('dragging');

    const onMouseMove = (e) => {
      const rect = panes.getBoundingClientRect();
      const offset = e.clientX - rect.left;
      const total = rect.width - divider.offsetWidth;
      const ratio = Math.max(0.1, Math.min(0.9, offset / rect.width));
      leftPane.style.flex = `${ratio} 1 0%`;
      rightPane.style.flex = `${1 - ratio} 1 0%`;
    };

    const onMouseUp = () => {
      document.body.classList.remove('resizing');
      divider.classList.remove('dragging');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    };

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  render();
</script>
</body>
